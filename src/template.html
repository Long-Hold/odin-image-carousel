<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel</title>
  </head>
  <body>
    <div class="carousel-outer">
      <div class="carousel">
        <div class="carousel-img-container active">
          <img src="./images/One.jpg" alt="" class="carousel-img" width="500" height="500" />
        </div>

        <div class="carousel-img-container">
          <img src="./images/Two.jpg" alt="" class="carousel-img" width="500" height="500" />
        </div>

        <div class="carousel-img-container">
          <img src="./images/Three.jpg" alt="" class="carousel-img" width="500" height="500" />
        </div>
      </div>

      <ol class="carousel-indicator">
        <li data-slide-to="1" class="active">===</li>
        <li data-slide-to="2">===</li>
        <li data-slide-to="3">===</li>
      </ol>

      <section class="carousel-controls">
        
        <div class="previous">
          <button type="button" data-direction="previous">
            prev
          </button>
        </div>

        <div class="next">
          <button type="button" data-direction="next">
            next
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
